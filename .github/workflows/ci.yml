name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar (núcleo offline + pytest; sem baixar modelos nem chamar API)
        run: pip install -e ".[dev]"
      - name: Testes
        run: pytest -q
      - name: Benchmark offline (TF-IDF e LSA)
        run: python -m benchmark_intencao --modelos tfidf lsa --saida /tmp/resultados
      - name: Publicar relatório como artefato
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-${{ matrix.python-version }}
          path: /tmp/resultados
