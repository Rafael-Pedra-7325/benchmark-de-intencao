[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-de-intencao"
version = "0.1.0"
description = "Benchmark de classificação de intenções de atendimento: TF-IDF + LR vs embeddings vs LLM zero-shot (acurácia, latência e custo)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rafael Fernandes de Souza Pedra" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.7"]
llm = ["groq>=0.11"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
todos = ["sentence-transformers>=2.7", "groq>=0.11"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["benchmark_intencao*"]
